
[package]
name = "ferrum-esp32"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josemariasosa/ferrum-drivers"

[workspace]
resolver = "3"

[dependencies]
esp-hal = { version = "1.2.2", default-features = false }

[features]
default = []
esp32c3 = ["esp-hal/esp32c3"]
