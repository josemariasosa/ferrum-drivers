[package]
name = "ferrum-rp2350"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josemariasosa/ferrum-drivers"
description = "RP2350 hardware adapters for Ferrum Drivers."
readme = "README.md"
keywords = ["rp2350", "pico-2", "embedded", "no-std", "dht11"]
categories = ["embedded", "no-std", "hardware-support"]
exclude = [".cargo/**"]

[badges]
maintenance = { status = "experimental" }

[workspace]
resolver = "3"

[dependencies]
ferrum-dht11 = { path = "../../crates/ferrum-dht11", version = "0.1.0", optional = true }
ferrum-nrf24 = { path = "../../crates/ferrum-nrf24", version = "0.1.0", optional = true }

rp235x-hal = { version = "0.4", default-features = false }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", optional = true }
rf24 = { package = "rf24-rs", git = "https://github.com/nRF24/rf24-rs", rev = "5052379", optional = true, default-features = false }

# RP2350 firmware example
[target.'thumbv8m.main-none-eabihf'.dev-dependencies]
embassy-futures = "0.1"
heapless = "0.8"
usb-device = "0.3"
usbd-serial = "0.2"
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }

[features]
default = []
dht11 = ["dep:ferrum-dht11"]
nrf24 = ["dep:ferrum-nrf24", "dep:embedded-hal-bus"]
rf24-external = ["dep:rf24", "dep:embedded-hal-bus"]

[[example]]
name = "pico2_dht11"
path = "examples/pico2_dht11.rs"
test = false
required-features = ["dht11"]

[[example]]
name = "pico2_nrf24_driver"
path = "examples/pico2_nrf24_driver.rs"
test = false
required-features = ["nrf24"]

[[example]]
name = "pico2_rf24_external"
path = "examples/pico2_rf24_external.rs"
test = false
required-features = ["rf24-external"]
