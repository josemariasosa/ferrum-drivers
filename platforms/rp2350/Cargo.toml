[package]
name = "ferrum-rp2350"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josemariasosa/ferrum-drivers"

[workspace]
resolver = "3"

[dependencies]
ferrum-dht11 = { path = "../../crates/ferrum-dht11", version = "0.1.0", optional = true }
rp235x-hal = { version = "0.4", default-features = false }
embedded-hal = "1.0"
embedded-hal-async = "1.0"

# RP2350 firmware example
[target.'thumbv8m.main-none-eabihf'.dev-dependencies]
embassy-futures = "0.1"
heapless = "0.8"
usb-device = "0.3"
usbd-serial = "0.2"
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }

[features]
default = []
dht11 = ["dep:ferrum-dht11"]

[[example]]
name = "pico2_dht11"
path = "examples/pico2_dht11.rs"
test = false
required-features = ["dht11"]
