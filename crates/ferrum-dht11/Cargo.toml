[package]
name = "ferrum-dht11"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable, hardware-independent no_std DHT11 temperature and humidity sensor driver."
readme = "README.md"
keywords = ["dht11", "embedded", "no-std", "sensor", "async"]
categories = ["embedded", "no-std", "hardware-support"]

[badges]
maintenance = { status = "experimental" }

# Hardware-independent driver dependencies
[dependencies]
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }

# Host-only testing
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = [
    "eh1",
    "embedded-hal-async",
] }
futures = "0.3"
