[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["examples/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josemariasosa/ferrum-drivers"

[workspace.dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
rp235x-hal = { version = "0.4", default-features = false }
esp-hal = { version = "1.2.2", default-features = false }
